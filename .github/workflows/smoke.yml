name: smoke

# Hafif smoke test: Netlify'a deploy edilmeden önce (main'e push ve PR'larda)
# sürüm tutarsızlığı, JS/JSON syntax hatası ve kırık yerel linkleri yakalar.
# Bağımlılık kurulumu yok — ubuntu imajında hazır gelen python3 + node ile çalışır.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Smoke test
        run: python3 scripts/smoke.py
