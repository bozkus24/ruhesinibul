<style>
:root{--bg:#f6f3f1;--surface:#fff;--surface-2:#faf7f6;--ink:#231a20;--muted:#8a7f87;--line:#e8e0e1;--accent:#e0405f;--accent-soft:#fbe6ea;--data:#1f9c92;--data-soft:#e2f2f0;--shadow:0 1px 2px rgba(35,26,32,.05),0 12px 30px -18px rgba(35,26,32,.28);--radius:14px;--font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--maxw:820px}
[data-theme=dark]{--bg:#151016;--surface:#1e1720;--surface-2:#241c26;--ink:#f2eaef;--muted:#9a8f98;--line:#332a33;--accent:#ff6a82;--accent-soft:#3a2028;--data:#3fc3b5;--data-soft:#173029;--shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -18px rgba(0,0,0,.7)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.sitenav{border-bottom:1px solid var(--line);background:var(--surface)}
.sitenav-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 18px}
.sitenav .nb{display:flex;align-items:center;gap:7px;font-weight:800;color:var(--accent);text-decoration:none;font-size:15.5px}
.sitenav .nb img{width:24px;height:24px}
.sitenav .sp{flex:1}
.sitenav a.lnk{color:var(--muted);text-decoration:none;font-weight:600;font-size:13.5px;white-space:nowrap}
.sitenav a.lnk:hover{color:var(--accent)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:22px 18px 60px}
.top{margin:14px 0 18px}
.eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:800}
h1{margin:6px 0 6px;font-size:clamp(23px,5vw,32px);letter-spacing:-.02em;line-height:1.12}
.lede{color:var(--muted);margin:0;font-size:15px}
.theme-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 16px;margin:14px 0}
.field{margin:0 0 14px}
.field>label{display:block;font-weight:700;font-size:13.5px;margin-bottom:6px}
.inp{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);color:var(--ink);font:inherit;font-size:15px}
.inp:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.hint{color:var(--muted);font-size:12.5px;margin:4px 0 0}
.crit{border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden;background:var(--surface-2)}
.crit-head{display:flex;align-items:center;gap:11px;padding:12px 13px;cursor:pointer;user-select:none}
.crit-head .ct{font-weight:700;font-size:14.5px;flex:1}
.crit-head .cstate{font-size:12px;color:var(--muted);font-weight:600}
.sw{position:relative;width:42px;height:24px;border-radius:20px;background:var(--line);flex:0 0 auto;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.crit.on .sw{background:var(--data)}
.crit.on .sw::after{left:20px}
.crit-body{display:none;padding:2px 13px 14px;border-top:1px solid var(--line)}
.crit.on .crit-body{display:block}
.opts{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 2px}
.opt{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;transition:.12s}
.opt:hover{border-color:var(--accent)}
.opt.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.subtle{font-size:12px;color:var(--muted);margin:10px 0 3px;font-weight:700;letter-spacing:.02em}
.rangepick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.rangepick .num{width:88px}
.rangepick span{color:var(--muted);font-size:13px}
.imp{display:flex;gap:6px;margin-top:8px}
.imp button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 0;border-radius:9px;font-weight:800;font-size:14px;cursor:pointer}
.imp button.sel{background:var(--data);border-color:var(--data);color:#fff}
.imp-lbl{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;margin-top:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:13px 18px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;background:var(--accent);color:#fff;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.data{background:var(--data)}
.addbtn{background:none;border:1px dashed var(--line);color:var(--accent);border-radius:11px;padding:11px;width:100%;font-weight:700;cursor:pointer;font-size:13.5px}
.addbig{background:linear-gradient(100deg,var(--accent-soft),var(--data-soft));border:2px solid var(--accent);color:var(--accent);border-radius:13px;padding:14px;width:100%;font-weight:800;cursor:pointer;font-size:15.5px;letter-spacing:-.01em;box-shadow:var(--shadow)}
.addbig:hover{background:var(--accent);color:#fff}
.msg{padding:11px 13px;border-radius:11px;font-size:13.5px;font-weight:600;margin:10px 0}
.msg.err{background:var(--accent-soft);color:var(--accent)}
.msg.ok{background:var(--data-soft);color:var(--data)}
.linkbox{display:flex;gap:8px;margin-top:10px}
.linkbox input{flex:1;min-width:0}
.linkbox .btn{white-space:nowrap;flex:none}
.result-ring{text-align:center;padding:14px 0 4px}
.big{font-size:58px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.big small{font-size:24px}
.lb-row{display:flex;align-items:center;gap:11px;padding:10px 4px;border-top:1px solid var(--line)}
.lb-row:first-child{border-top:none}
.lb-rank{width:26px;text-align:center;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.lb-name{flex:1;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-score{font-weight:800;color:var(--data);font-variant-numeric:tabular-nums}
.lb-row.me{background:var(--accent-soft);border-radius:10px;padding-left:8px;padding-right:8px}
.lb-row.top1 .lb-rank{color:#e0a020}
.lbscroll{max-height:396px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.lbscroll::-webkit-scrollbar{width:8px}
.lbscroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.lbscroll{scrollbar-width:thin}
.mini{font-size:12px;color:var(--muted)}
.trash{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;padding:0}
.trash svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.trash:hover{border-color:var(--accent)}
.trash:hover svg{stroke:var(--accent)}
.rdet{border-top:1px solid var(--line)}
.rdet:first-child{border-top:none}
.rdet summary{display:flex;align-items:center;gap:11px;padding:11px 4px;cursor:pointer;list-style:none}
.rdet summary::-webkit-details-marker{display:none}
.rdet summary .exp{color:var(--muted);font-size:11px;flex:0 0 auto}
.rdet[open] summary .exp{transform:rotate(90deg)}
.ansrows{padding:2px 6px 12px 37px}
.ansrow{display:flex;align-items:baseline;gap:10px;font-size:13px;padding:6px 0;border-top:1px dashed var(--line)}
.ansrow:first-child{border-top:none}
.ansrow .at{color:var(--muted);flex:1;min-width:0}
.ansrow .av2{font-weight:700;text-align:right}
.ansrow .ap{font-weight:800;width:34px;text-align:right;font-variant-numeric:tabular-nums}
.ap.full{color:var(--data)}.ap.zero{color:var(--accent)}.ap.part{color:#e0a020}
footer{border-top:1px solid var(--line);margin-top:30px;padding:20px 18px;color:var(--muted);font-size:12.5px;text-align:center}
footer a{color:var(--muted);margin:0 7px;text-decoration:none}
.center{text-align:center}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

<script type="module">
/* ============ tema ============ */
(function(){
  try{
    var t=localStorage.getItem("kriterin_tema");
    if(!t)t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";
    document.documentElement.setAttribute("data-theme",t);
  }catch(e){}
})();
document.getElementById("themeBtn").addEventListener("click",function(){
  var e=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",e);
  try{localStorage.setItem("kriterin_tema",e)}catch(x){}
});

/* ============ kriter seti (IQ hariç) ============ */
/* type: gender | single | multi | range   */
/* option label: l (ortak) · lc (kurucu bakışı) · lr (katılımcı bakışı) opsiyonel */
const CRITERIA=[
  {id:"yas",title:"Yaş",type:"range",min:18,max:90,unit:"",dmin:25,dmax:35,step:1},
  {id:"boy",title:"Boy",type:"range",min:130,max:250,unit:" cm",dmin:165,dmax:185,step:2},
  {id:"sehir",title:"Şehir",type:"multi",options:[{v:"istanbul",l:"İstanbul"},{v:"ankara",l:"Ankara"},{v:"izmir",l:"İzmir"},{v:"bursa",l:"Bursa"},{v:"antalya",l:"Antalya"},{v:"diger",l:"Diğer"}]},
  {id:"irk",title:"Etnik köken",type:"multi",options:[{v:"turk",l:"Türk"},{v:"kurt",l:"Kürt"},{v:"zaza",l:"Zaza"},{v:"arap",l:"Arap"},{v:"cerkez",l:"Çerkez"},{v:"bosnak",l:"Boşnak"},{v:"laz",l:"Laz"},{v:"arnavut",l:"Arnavut"},{v:"gurcu",l:"Gürcü"},{v:"roman",l:"Roman"},{v:"diger",l:"Diğer"}]},
  {id:"din",title:"Din",type:"multi",options:[{v:"musluman",l:"Müslüman"},{v:"deist",l:"Deist"},{v:"agnostik",l:"Agnostik"},{v:"ateist",l:"Ateist"},{v:"musevi",l:"Musevi"},{v:"diger",l:"Diğer"}]},
  {id:"egitim",title:"Eğitim durumu",type:"multi",hint:"Devam edilen okulu değil, en son mezun olunan okulu seçin.",options:[{v:"yok",l:"Okul bitirmemiş"},{v:"ilk",l:"İlkokul"},{v:"orta",l:"Ortaokul"},{v:"lise",l:"Lise"},{v:"onlisans",l:"Ön lisans"},{v:"lisans",l:"Lisans"},{v:"yl",l:"Yüksek lisans"},{v:"dr",l:"Doktora"}]},
  {id:"maas",title:"Aylık maaş",type:"multi",options:[{v:"m1",l:"28.072 ₺ ve altı"},{v:"m2",l:"28.073–42.108 ₺"},{v:"m3",l:"42.109–56.144 ₺"},{v:"m4",l:"56.145–84.216 ₺"},{v:"m5",l:"84.217–112.288 ₺"},{v:"m6",l:"112.289–127.000 ₺"},{v:"m7",l:"127.001 ₺ ve üstü"}]},
  {id:"sigara",title:"Sigara",type:"single",options:[{v:"evet",l:"İçiyor",lc:"İçsin",lr:"İçiyorum"},{v:"hayir",l:"İçmiyor",lc:"İçmesin",lr:"İçmiyorum"}]},
  {id:"alkol",title:"Alkol",type:"single",options:[{v:"evet",l:"İçiyor",lc:"İçsin",lr:"İçiyorum"},{v:"hayir",l:"İçmiyor",lc:"İçmesin",lr:"İçmiyorum"}]},
  {id:"vucut",title:"Vücut tipi",type:"multi",options:[{v:"zayif",l:"Zayıf"},{v:"normal",l:"Normal"},{v:"atletik",l:"Atletik / kaslı"},{v:"kilolu",l:"Kilolu"},{v:"obez",l:"Obez"}]},
  {id:"sacRenk",title:"Saç rengi",type:"multi",options:[{v:"siyah",l:"Siyah"},{v:"koyukahve",l:"Koyu kahverengi"},{v:"kumral",l:"Kumral"},{v:"sari",l:"Sarı"},{v:"kizil",l:"Kızıl"}]},
  {id:"sacSekil",title:"Saç şekli",type:"multi",options:[{v:"duz",l:"Düz"},{v:"dalgali",l:"Dalgalı"},{v:"kivircik",l:"Kıvırcık"}]},
  {id:"goz",title:"Göz rengi",type:"multi",options:[{v:"kahve",l:"Kahverengi / Siyah"},{v:"ela",l:"Ela / Bal"},{v:"yesil",l:"Yeşil"},{v:"mavi",l:"Mavi"}]},
  {id:"burc",title:"Burç",type:"multi",options:[{v:"koc",l:"Koç"},{v:"boga",l:"Boğa"},{v:"ikizler",l:"İkizler"},{v:"yengec",l:"Yengeç"},{v:"aslan",l:"Aslan"},{v:"basak",l:"Başak"},{v:"terazi",l:"Terazi"},{v:"akrep",l:"Akrep"},{v:"yay",l:"Yay"},{v:"oglak",l:"Oğlak"},{v:"kova",l:"Kova"},{v:"balik",l:"Balık"}]},
  {id:"takim",title:"Tuttuğu takım",type:"multi",options:[{v:"gs",l:"Galatasaray"},{v:"fb",l:"Fenerbahçe"},{v:"bjk",l:"Beşiktaş"},{v:"ts",l:"Trabzonspor"},{v:"diger",l:"Diğer"},{v:"yok",l:"Takım tutmuyor"}]},
  {id:"cocuk",title:"Çocuk ister mi?",type:"single",options:[{v:"evet",l:"İstiyor",lc:"İstesin",lr:"İstiyorum"},{v:"hayir",l:"İstemiyor",lc:"İstemesin",lr:"İstemiyorum"}]}
];
const CMAP=Object.fromEntries(CRITERIA.map(c=>[c.id,c]));
function optLabel(o,persp){return (persp==="c"&&o.lc)||(persp==="r"&&o.lr)||o.l;}

/* ============ Store: Firestore öncelikli, offline'da localStorage ============ */
const Store=(function(){
  let db=null,fs=null,ready=false,userP=Promise.resolve(null);
  async function init(){
    try{
      const app=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
      const store=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
      const cfg={apiKey:"AIzaSyD_MIekQmU9wOtam8vrckMyhgjHKD_ZR9o",authDomain:"kriterin.firebaseapp.com",projectId:"kriterin",storageBucket:"kriterin.firebasestorage.app",messagingSenderId:"46765593126",appId:"1:46765593126:web:25738b3ebc5f1168f0cce7"};
      const a=app.initializeApp(cfg,"anket");
      db=store.getFirestore(a); fs=store; ready=true;
      // Günün Sorusu'nda Google ile giriş yapan kullanıcıyı tanı (aynı proje, aynı oturum)
      userP=(async()=>{
        try{
          const am=await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");
          const auth=am.getAuth(a);
          return await new Promise(res=>{
            const t=setTimeout(()=>res(null),3000);
            am.onAuthStateChanged(auth,u=>{clearTimeout(t);res(u||null);},()=>{clearTimeout(t);res(null);});
          });
        }catch(e){return null;}
      })();
    }catch(e){ ready=false; } // offline/önizleme → localStorage
  }
  const initP=init();
  // localStorage fallback helpers
  function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}
  function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function rid(){return Math.random().toString(36).slice(2,9)}
  return {
    async getUser(){ await initP; return userP; },
    async online(){ await initP; return ready; },
    async createSurvey(data){
      await initP;
      if(ready){
        const {collection,addDoc}=fs;
        const ref=await addDoc(collection(db,"surveys"),{...data,createdAt:Date.now()});
        return ref.id;
      }
      const id="loc_"+rid();
      lsSet("kriterin_anket_"+id,{...data,createdAt:Date.now(),responses:[]});
      return id;
    },
    async getSurvey(id){
      await initP;
      if(ready&&!id.startsWith("loc_")){
        const {doc,getDoc}=fs;
        const s=await getDoc(doc(db,"surveys",id));
        if(!s.exists())return null;
        const d=s.data();
        return d.deleted?null:d;
      }
      const d=lsGet("kriterin_anket_"+id);
      return d?{name:d.name,criteria:d.criteria,key:d.key}:null;
    },
    // Yumuşak silme: yalnızca gizli anahtarı bilen (kurucu) silebilir.
    // Kural, delKey === key eşleşmesini ve sadece bu iki alanın değişmesini ister.
    async deleteSurvey(id,key){
      await initP;
      if(ready&&!id.startsWith("loc_")){
        const {doc,setDoc}=fs;
        await setDoc(doc(db,"surveys",id),{deleted:true,delKey:key||""},{merge:true});
        return;
      }
      try{localStorage.removeItem("kriterin_anket_"+id)}catch(e){}
    },
    async addResponse(id,resp){
      await initP;
      if(ready&&!id.startsWith("loc_")){
        const {collection,addDoc}=fs;

/* ============ skor hesabı ============
   Her soru 5 puan üzerinden: doğru şık 5, yanlış şık 0.
   Alınan puan = pts(0–5) × ağırlık.  Tavan = 5 × ağırlık.
   Boy: aralık dışında her `step` cm (2) için 1 puan düşer.
   Yaş: aralık dışında her `step` yaş (1) için 1 puan düşer.
   Uyum % = Σ(alınan) / Σ(tavan) × 100
========================================= */
const MAXPTS=5;
function rangePoints(c,n){
  if(isNaN(n))return 0;
  if(n>=c.min&&n<=c.max)return MAXPTS;
  const step=c.step||1;
  const dist=n<c.min?(c.min-n):(n-c.max);
  const drop=Math.ceil(dist/step);
  return Math.max(0,MAXPTS-drop);
}
function computeScore(survey,answers){
  let got=0,maxTotal=0; const brk=[];
  for(const c of survey.criteria){
    const w=c.weight; maxTotal+=MAXPTS*w;
    let pts=0; const ans=answers[c.id];
    if(c.type==="range"){
      pts=(ans===""||ans==null)?0:rangePoints(c,Number(ans));
    }else{
      pts=(ans!=null&&c.accepted.includes(ans))?MAXPTS:0;
    }
    got+=pts*w;
    brk.push({id:c.id,title:c.title,w,pts,earned:pts*w,max:MAXPTS*w,match:pts===MAXPTS?1:0});
  }
  // En yakın ondalığa yuvarlanmış yüzde (örn. 82.7)
  const score=maxTotal>0?Math.round(1000*got/maxTotal)/10:0;
  return {score,brk,got,maxTotal};
}
// %82.7 gibi göster; tam sayıysa ondalıksız (%100)
const fmtScore=s=>{const n=Math.round(Number(s)*10)/10;return Number.isInteger(n)?String(n):n.toFixed(1);};

async function routeSurvey(id){

  try{

function buildCritEditor(c,st){
  const el=h(`<div class="crit" data-id="${c.id}">
    <div class="crit-head"><div class="sw"></div><div class="ct">${esc(c.title)}</div><div class="cstate">Kapalı</div></div>
    <div class="crit-body"></div>
  </div>`);
  const head=el.querySelector(".crit-head"), body=el.querySelector(".crit-body"), stateLbl=el.querySelector(".cstate");
  const sw=el.querySelector(".sw");
  function refreshState(){ stateLbl.textContent=st.on?("Açık · önem "+st.weight):"Kapalı"; }
  head.addEventListener("click",(e)=>{
    // toggle switch açar/kapatır; body açıkken başlığa tıklamak da toggle etmesin diye sadece switch bölgesi + head toggle
    st.on=!st.on; el.classList.toggle("on",st.on); refreshState();
  });

  if(c.type==="range"){
    const rp=h(`<div>
      <div class="subtle">Aradığın aralık</div>
      <div class="rangepick">
        <input class="inp num" type="number" min="${c.min}" max="${c.max}" value="${st.min}" id="rmin">
        <span>—</span>
        <input class="inp num" type="number" min="${c.min}" max="${c.max}" value="${st.max}" id="rmax">
        <span>${esc(c.unit)}</span>
      </div>
      <p class="hint">Aralık içi tam puan (5/5). Dışına çıktıkça her ${c.step}${esc(c.unit)||" yaş"} için 1 puan düşer.</p>
    </div>`);
    const clampRange=el=>el.addEventListener("change",e=>{
      const v=e.target.value; if(v==="")return;
      let n=Math.round(Number(v)); if(isNaN(n))return;
      n=Math.min(c.max,Math.max(c.min,n)); e.target.value=n;
      if(e.target.id==="rmin")st.min=n; else st.max=n;
    });
    rp.querySelector("#rmin").addEventListener("input",e=>st.min=e.target.value);
    rp.querySelector("#rmax").addEventListener("input",e=>st.max=e.target.value);
    clampRange(rp.querySelector("#rmin")); clampRange(rp.querySelector("#rmax"));
    body.appendChild(rp);
  }else{
    const multi=(c.type==="multi"||c.type==="gender");
    const sub=h(`<div><div class="subtle">${multi?"İstediğin seçenekler (birden fazla olabilir)":"İstediğin cevap"}</div>${c.hint?`<p class="hint" style="margin:0 0 2px">${c.hint}</p>`:""}<div class="opts"></div></div>`);
    const opts=sub.querySelector(".opts");
    c.options.forEach(o=>{
      const b=h(`<button type="button" class="opt">${esc(optLabel(o,"c"))}</button>`);
      b.addEventListener("click",()=>{
        if(multi){
          const i=st.accepted.indexOf(o.v);
          if(i>=0)st.accepted.splice(i,1); else st.accepted.push(o.v);
          b.classList.toggle("sel",st.accepted.includes(o.v));
        }else{
          st.accepted=[o.v];
          opts.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));
          b.classList.add("sel");
        }
      });
      opts.appendChild(b);
    });
    body.appendChild(sub);
  }
  body.appendChild(weightControl(st));
  // önem değişince state etiketi güncellensin
  body.querySelectorAll(".imp button").forEach(b=>b.addEventListener("click",refreshState));
  refreshState();
  return el;
}

      <a class="btn" style="text-decoration:none" href="/anket.html">Kendi anketini oluştur →</a>`;
    return;
  }
  const alreadyKey="kriterin_anket_done_"+id;
  let done=null; try{done=JSON.parse(localStorage.getItem(alreadyKey)||"null")}catch(e){}

  app.innerHTML="";

  if(done){ showResult(done.score,done.name,true); return; }

  // Google ile giriş yapmışsa (Günün Sorusu'ndan) takma ad sorulmaz, Google adı kullanılır
  let gUser=null; try{ gUser=await Store.getUser(); }catch(e){}
  const gName=gUser&&gUser.displayName?String(gUser.displayName).trim().slice(0,24):"";
  let nameCard=null;
  if(gName){
    app.appendChild(h(`<div class="msg ok" style="margin:0 0 4px">Merhaba <b>${esc(gName)}</b> — liderlik tablosunda bu isimle görüneceksin.</div>`));
  }else{
    nameCard=h(`<div class="card"><div class="field" style="margin:0">
      <label for="rname">Takma adın</label>
      <input class="inp" id="rname" maxlength="24" placeholder="Örn: Mehmet">
      <p class="hint">Liderlik tablosunda bu isim görünecek.</p>
    </div></div>`);
    app.appendChild(nameCard);
  }

  const answers={};
  const form=h(`<div></div>`);
  survey.criteria.forEach(c=>form.appendChild(buildRespondField(c,answers)));
  app.appendChild(form);

  const err=h(`<div class="msg err" id="rErr" style="display:none"></div>`);
  const submit=h(`<button class="btn" style="margin-top:6px">Uyumumu hesapla</button>`);
  app.appendChild(err); app.appendChild(submit);

  submit.addEventListener("click",async()=>{
    err.style.display="none";
    const name=gName||(nameCard?nameCard.querySelector("#rname").value.trim():"");
    for(const c of survey.criteria){
      if(answers[c.id]==null||answers[c.id]===""){
        err.textContent=`"${c.title}" için cevabını gir.`; err.style.display="block";
        err.scrollIntoView({behavior:"smooth",block:"center"}); return;
      }
    }
    if(!name){ err.textContent="Takma adını yaz."; err.style.display="block"; return; }
    const {score}=computeScore(survey,answers);
    // Cevaplar da kaydedilir — kurucu sonuçlar sayfasında görebilsin
    const cleanAns={};
    for(const c of survey.criteria){ cleanAns[c.id]=String(answers[c.id]).slice(0,60); }
    submit.disabled=true; submit.innerHTML='<span class="spin" style="width:16px;height:16px;border-width:2px"></span>';
    try{
      await Store.addResponse(id,{name,score,answers:cleanAns});
    }catch(e){
      // Kayıt başarısız: sahte başarı gösterme — kullanıcı tekrar deneyebilsin
      submit.disabled=false; submit.textContent="Uyumumu hesapla";
      err.textContent="Cevabın kaydedilemedi — liderlik tablosuna eklenemedin. İnternetini kontrol edip tekrar dene.";
      err.style.display="block"; err.scrollIntoView({behavior:"smooth",block:"center"});
      return;
    }
    try{ localStorage.setItem(alreadyKey,JSON.stringify({score,name})); }catch(e){}
    app.innerHTML="";
    app.appendChild(h(`<div class="top">
      <div class="eyebrow">${esc(survey.name)}</div>
      <h1>Sonucun</h1></div>`));
    showResult(score,name,false);
  });

  function buildRespondField(c,answers){
    const el=h(`<div class="card"><div class="field" style="margin:0">
      <label>${esc(c.title)}</label>
      ${c.hint?`<p class="hint" style="margin:0 0 7px">${c.hint}</p>`:""}
      <div data-body></div></div></div>`);
    const body=el.querySelector("[data-body]");
    if(c.type==="range"){
      const lo=c.absMin!=null?c.absMin:c.min, hi=c.absMax!=null?c.absMax:c.max;
      const inp=h(`<input class="inp" type="number" inputmode="numeric" min="${lo}" max="${hi}" placeholder="Kendi ${esc(c.title.toLowerCase())} değerini yaz${esc(c.unit||"")}">`);
      inp.addEventListener("input",e=>answers[c.id]=e.target.value);
      // Sınır dışına çıkılırsa değeri kıstır (ör. yaş 18'in altına inemez)
      inp.addEventListener("change",e=>{
        const v=e.target.value; if(v==="")return;
        let n=Math.round(Number(v)); if(isNaN(n))return;
        n=Math.min(hi,Math.max(lo,n));
        e.target.value=n; answers[c.id]=String(n);
      });
      body.appendChild(inp);
    }else{
      const opts=h(`<div class="opts" style="margin-top:2px"></div>`);
      c.options.forEach(o=>{
        const b=h(`<button type="button" class="opt">${esc(optLabel(o,"r"))}</button>`);
        b.addEventListener("click",()=>{
          answers[c.id]=o.v;
          opts.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));
          b.classList.add("sel");
        });
        opts.appendChild(b);
      });
      body.appendChild(opts);
    }
    return el;
  }

  /* Puan dökümü bilerek gösterilmiyor — katılımcı neyden puan aldığını görmez.
     Sadece toplam % + liderlik tablosu. */
  async function showResult(score,name,revisit){
    const res=h(`<div class="card">
      <div class="result-ring"><div class="big">${fmtScore(score)}<small>%</small></div>
      <div class="mini">${name?esc(name)+" · ":""}${esc(survey.name)} ile uyumun</div></div>
      <div class="subtle" style="margin-top:10px">Liderlik Tablosu</div>
      <div data-panel><div class="center" style="padding:24px 0"><span class="spin"></span></div></div>
    </div>`);
    app.appendChild(res);
    const panel=res.querySelector("[data-panel]");
    function paintRows(rows){
      panel.innerHTML="";
      if(!rows.length){
        panel.appendChild(h(`<p class="mini center" style="padding:16px 0">Henüz kimse yok. İlk sensin! 🎉</p>`));
        return;
      }
      const wrap=h(`<div class="lbscroll"></div>`);
      rows.forEach((r,i)=>{
        const me=(r.name===name&&Math.round(r.score*10)===Math.round(score*10));
        wrap.appendChild(h(`<div class="lb-row ${i===0?"top1":""} ${me?"me":""}">
          <span class="lb-rank">${i===0?"🥇":i===1?"🥈":i===2?"🥉":(i+1)}</span>
          <span class="lb-name">${esc(r.name||"—")}</span>
          <span class="lb-score">%${fmtScore(r.score)}</span>
        </div>`));
      });
      panel.appendChild(wrap);
    }
    async function loadRows(){
      panel.innerHTML='<div class="center" style="padding:24px 0"><span class="spin"></span></div>';
      let rows=null; try{rows=await Store.getLeaderboard(id);}catch(e){rows=null;}
      if(rows!==null){ paintRows(rows); return; }
      // Hata ile "henüz boş"u ayırt et: sorun varsa kullanıcı bilsin, tekrar deneyebilsin
      panel.innerHTML="";
      const retry=h(`<div><p class="mini center" style="padding:10px 0 6px">Liderlik tablosu yüklenemedi.</p><button class="btn sec" style="margin-bottom:6px">Tekrar dene</button></div>`);
      retry.querySelector("button").addEventListener("click",loadRows);
      panel.appendChild(retry);
    }
    await loadRows();
    app.appendChild(h(`<a class="btn data" style="margin-top:14px;text-decoration:none" href="/anket.html">Kendi anketini yap →</a>`));
    if(revisit){
      app.insertBefore(h(`<div class="msg ok">Bu ankete daha önce katıldın — sonucun ve liderlik tablosu aşağıda.</div>`),res);
    }
  }
}

/* =========================================================
   SONUÇLAR MODU (sadece kurucu — ?id=X&k=ANAHTAR)
   Katılımcılar, skorları ve verdikleri cevaplar.
========================================================= */
async function renderResults(id,k){
  app.innerHTML='<div class="center" style="padding:60px 0"><span class="spin"></span></div>';
  let survey; try{ survey=await Store.getSurvey(id); }catch(e){ survey=null; }
  if(!survey){
    app.innerHTML=`<div class="top"><h1>Anket bulunamadı</h1><p class="lede">Bu link geçersiz ya da anket kaldırılmış olabilir.</p></div>
      <a class="btn" style="text-decoration:none" href="/anket.html">Kendi anketini oluştur →</a>`;
    return;
  }
  const mine=myList()[id];
  let gu=null; try{ gu=await Store.getUser(); }catch(e){}
  const okKey=!survey.key || k===survey.key || (mine&&mine.key===survey.key) || (gu&&survey.owner&&gu.uid===survey.owner);
  if(!okKey){
    app.innerHTML="";
    app.appendChild(h(`<div class="top"><h1>Bu sayfa anketin sahibine özel</h1>
      <p class="lede">Katılımcı listesi ve cevaplar yalnızca kurucuya görünür. Anketi sen oluşturduysan, linki oluşturduğun cihazdan ya da Google girişi yaptığın bir cihazdan aç.</p></div>`));
    app.appendChild(h(`<a class="btn" style="text-decoration:none" href="${esc(location.origin+location.pathname+"?id="+id)}">Ankete katıl →</a>`));
    return;
  }
  mySave(id,survey.key||"",survey.name);

  app.innerHTML="";
  const shareUrl=location.origin+location.pathname+"?id="+id;
  app.appendChild(h(`<div class="top">
    <div class="eyebrow">Sonuçlar · sadece sen görüyorsun</div>
    <h1>${esc(survey.name)}</h1>
    <p class="lede">Kim katıldı, yüzde kaç aldı, hangi cevabı verdi — hepsi burada. Bir katılımcıya dokununca cevapları açılır.</p>
  </div>`));
  const shareCard=h(`<div class="card">
    <div class="subtle" style="margin-top:0">Anket linkin — arkadaşlarına at</div>
    <div class="linkbox"><input class="inp" id="shareUrl" readonly value="${esc(shareUrl)}"></div>
    <div data-share style="margin-top:12px"></div>
    <p class="hint" style="margin:8px 0 0">Arkadaşların bu linkte anketi cevaplar; sen tıkladığında sonuçları görürsün.</p>
  </div>`);
  app.appendChild(shareCard);
  shareCard.querySelector("[data-share]").appendChild(shareMenu(shareUrl));

  const board=h(`<div class="card">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="subtle" style="margin:0;flex:1">Katılımcılar · <span data-count>—</span></div>
      <button class="btn sec" data-refresh style="width:auto;padding:8px 14px;font-size:13px">Yenile</button>
    </div>
    <div data-rows style="margin-top:8px"></div>
  </div>`);
  app.appendChild(board);
  const rowsEl=board.querySelector("[data-rows]"), countEl=board.querySelector("[data-count]");

  function ptsMark(r){
    const cls=r.pts===MAXPTS?"full":(r.pts>0?"part":"zero");
    return `<span class="ap ${cls}">${r.pts}/5</span>`;
  }
  function paint(rows){
    countEl.textContent=rows.length+" kişi";
    rowsEl.innerHTML="";
    if(!rows.length){
      rowsEl.appendChild(h(`<p class="mini center" style="padding:14px 0">Henüz katılan yok. Katılım linkini paylaş! 🎉</p>`));
      return;
    }
    const box=h(`<div class="lbscroll"></div>`);
    rows.forEach((r,i)=>{
      let inner;
      if(r.answers){
        const {brk}=computeScore(survey,r.answers);
        inner=survey.criteria.map(c=>{
          const b=brk.find(x=>x.id===c.id)||{pts:0};
          return `<div class="ansrow"><span class="at">${esc(c.title)}</span><span class="av2">${esc(answerLabel(c,r.answers[c.id]))}</span>${ptsMark(b)}</div>`;
        }).join("");
      }else{
        inner=`<p class="mini" style="padding:4px 0">Cevap detayı kaydedilmemiş (eski katılım).</p>`;
      }
      box.appendChild(h(`<details class="rdet">
        <summary>
          <span class="lb-rank">${i===0?"🥇":i===1?"🥈":i===2?"🥉":(i+1)}</span>
          <span class="lb-name">${esc(r.name||"—")}</span>
          <span class="lb-score">%${fmtScore(r.score)}</span>
          <span class="exp">▶</span>
        </summary>
        <div class="ansrows">${inner}</div>
      </details>`));
    });
    rowsEl.appendChild(box);
  }
  async function load(){
    rowsEl.innerHTML='<div class="center" style="padding:22px 0"><span class="spin"></span></div>';
    let rows=null; try{ rows=await Store.getLeaderboard(id); }catch(e){ rows=null; }
    if(rows===null){
      rowsEl.innerHTML="";
      const retry=h(`<div><p class="mini center" style="padding:10px 0 6px">Katılımcılar yüklenemedi.</p><button class="btn sec" style="margin-bottom:4px">Tekrar dene</button></div>`);
      retry.querySelector("button").addEventListener("click",load);
      rowsEl.appendChild(retry); countEl.textContent="—";
      return;
    }
    paint(rows);
  }
  board.querySelector("[data-refresh]").addEventListener("click",load);
  await load();
}
</script>
</body>
</html>
