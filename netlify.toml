# Kriterin — statik site (build adımı yok, dosyalar kök dizinde)
[build]
  publish = "."
  command = ""
  # Sadece belge/yazı (*.md) değişmişse deploy'u atla — boşa deploy kredisi yakma.
  # Son deploy edilen commit ile şimdiki commit arasında site dosyası değişmediyse iptal eder.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)*.md'"

# Anket paylaşım önizlemesi: ?id'li linklerde başlık anket ismiyle değişir
[[edge_functions]]
  path = "/anket.html"
  function = "anket-og"

# Sunucu tarafı fonksiyonlar (günün sorusu liderlik özeti)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Temiz yol: /api/leaderboard -> liderlik fonksiyonu (CDN önbellekli)
[[redirects]]
  from = "/api/leaderboard"
  to = "/.netlify/functions/leaderboard"
  status = 200

# Günün Sorusu temiz URL: /gunun-sorusu sayfayı sunar (adres çubuğunda .html yok);
# eski /gunun-sorusu.html ise tek kanonik adrese kalıcı (301) yönlenir. Rewrite
# hedefi (200) yeniden yönlendirme motorundan geçmediği için döngü oluşmaz.
[[redirects]]
  from = "/gunun-sorusu.html"
  to = "/gunun-sorusu"
  status = 301
  force = true

[[redirects]]
  from = "/gunun-sorusu"
  to = "/gunun-sorusu.html"
  status = 200

# site/ klasörü yalnızca arşiv kaynak (makale üreteçleri) — yayında servis edilmesin.
# force = true şart: dosyalar publish dizininde gerçekten var, onsuz statik
# dosya kuralı geçer ve kaynak yine sunulur.
[[redirects]]
  from = "/site/*"
  to = "/404.html"
  status = 404
  force = true

# Güvenlik başlıkları (tüm sayfalar)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # Konservatif CSP: script/style/connect kısıtlanmıyor (AdSense/GA/Firebase/
    # reCAPTCHA çalışmaya devam etsin) ama eklenti/nesne (object) engelli,
    # <base> enjeksiyonu (base-uri) ve clickjacking (frame-ancestors) kapalı.
    Content-Security-Policy = "object-src 'none'; base-uri 'self'; frame-ancestors 'self'"

# Görseller (favicon, og.png vb.) uzun süre önbelleklensin — tekrar indirilmesin.
# Değişirlerse yeni ad ver (ör. og-v2.png) ya da bu süreyi düşür.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS orta vadeli önbellek (güncelleme esnekliği için 1 hafta)
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Service worker: saatte bir kontrol (her gezinmede yeniden indirilmesin ama
# güncellemeler ~1 saatte yayılsın). Kredi/istek tasarrufu için no-cache yerine.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Web app manifest doğru MIME tipiyle, 1 gün önbellekle
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"
